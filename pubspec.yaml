name: expense_debt_manager
description: A fully functional Expense and Debt Manager built with Flutter and Riverpod.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  pdf: ^3.11.1
  printing: ^5.13.2
  http: ^1.2.0
  nepali_utils: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  crypto: ^3.0.3
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
